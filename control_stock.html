<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Control Stock | Quirino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #0f0f12;
  --surface: #1a1a22;
  --surface2: #22222e;
  --border: #2e2e3e;
  --accent: #f5a623;
  --accent2: #e8612a;
  --green: #2ecc71;
  --red: #e74c3c;
  --yellow: #f1c40f;
  --blue: #3498db;
  --text: #e8e8f0;
  --muted: #888899;
  --font: 'Segoe UI', system-ui, sans-serif;
  --radius: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; }

/* ── LOGIN ── */
#login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; gap:24px; background: radial-gradient(ellipse at 50% 30%, #1e1a2e 0%, #0f0f12 70%); }
.logo-box { text-align:center; }
.logo-box h1 { font-size:28px; font-weight:900; letter-spacing:2px; background: linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.logo-box p { color:var(--muted); font-size:13px; margin-top:4px; }
.login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px 24px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:16px; }
.login-card h2 { font-size:18px; color:var(--text); }
.role-btns { display:flex; gap:10px; }
.role-btn { flex:1; padding:14px 8px; border:2px solid var(--border); border-radius:10px; background:transparent; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; text-align:center; }
.role-btn.active, .role-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.08); }
.field-group { display:flex; flex-direction:column; gap:8px; }
.field-group label { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.field-group input, .field-group select { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:12px 14px; font-size:15px; width:100%; outline:none; transition:border-color .2s; }
.field-group input:focus, .field-group select:focus { border-color:var(--accent); }
.btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; border-radius:10px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; width:100%; transition:opacity .2s; }
.btn-primary:active { opacity:.85; }
.err { color:var(--red); font-size:13px; text-align:center; display:none; }

/* ── HEADER ── */
#app { display:none; flex-direction:column; min-height:100vh; }
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.header-left { display:flex; align-items:center; gap:12px; }
.brand { font-size:16px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.role-badge { background:rgba(245,166,35,.15); color:var(--accent); border:1px solid rgba(245,166,35,.3); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }
.logout-btn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; }

/* ── TABS ── */
.tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { flex-shrink:0; padding:12px 16px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap; }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ── CONTENT ── */
.content { flex:1; padding:16px; max-width:600px; margin:0 auto; width:100%; }

/* ── CARDS ── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card h3 { font-size:15px; font-weight:700; margin-bottom:12px; color:var(--text); }
.card-row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }

/* ── PROVIDER SELECT ── */
.prov-select { background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px 14px; font-size:15px; width:100%; outline:none; }
.prov-select:focus { border-color:var(--accent); }

/* ── SEARCH ── */
.search-wrap { position:relative; }
.search-input { background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:12px 40px 12px 14px; font-size:15px; width:100%; outline:none; }
.search-input:focus { border-color:var(--accent); }
.search-clear { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px; }

/* ── SCANNER ── */
.scan-btn { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); padding:13px 16px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
.scan-btn:active { background:var(--border); }
.scan-area { display:none; flex-direction:column; gap:10px; }
.scan-area.active { display:flex; }
#camera-feed { width:100%; border-radius:10px; border:2px solid var(--accent); max-height:240px; object-fit:cover; }
.scan-overlay { position:relative; }
.scan-line { position:absolute; left:10%; width:80%; height:2px; background:var(--accent); opacity:.8; animation:scan 2s linear infinite; top:20%; border-radius:2px; }
@keyframes scan { 0%{top:15%} 50%{top:70%} 100%{top:15%} }
.camera-btns { display:flex; gap:8px; }
.cam-btn { flex:1; padding:11px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
.cam-stop { background:var(--red); color:#fff; }
.cam-flip { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.manual-scan-row { display:flex; gap:8px; }
.manual-scan-row input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:11px 12px; font-size:15px; outline:none; }
.manual-scan-row button { background:var(--blue); color:#fff; border:none; border-radius:8px; padding:11px 14px; font-size:13px; font-weight:600; cursor:pointer; }

/* ── PRODUCT LIST ── */
.prod-list { display:flex; flex-direction:column; gap:8px; }
.prod-item { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:12px; transition:border-color .2s; }
.prod-item.scanned { border-color:var(--accent); background:rgba(245,166,35,.04); }
.prod-info { flex:1; min-width:0; }
.prod-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prod-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.prod-stock { font-size:12px; color:var(--accent); font-weight:700; }
.qty-ctrl { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.qty-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; }
.qty-btn:active { background:var(--border); }
.qty-input { width:48px; text-align:center; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:15px; font-weight:700; padding:5px 2px; outline:none; }
.diff-badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; flex-shrink:0; }
.diff-ok { background:rgba(46,204,113,.15); color:var(--green); }
.diff-neg { background:rgba(231,76,60,.15); color:var(--red); }
.diff-pos { background:rgba(52,152,219,.15); color:var(--blue); }
.diff-none { background:var(--surface2); color:var(--muted); }

/* ── STATS ── */
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat-box { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
.stat-val { font-size:22px; font-weight:900; }
.stat-val.ok { color:var(--green); }
.stat-val.neg { color:var(--red); }
.stat-val.pos { color:var(--blue); }
.stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── REPORT BTNS ── */
.action-row { display:flex; gap:8px; flex-wrap:wrap; }
.action-btn { flex:1; min-width:120px; padding:12px 8px; border-radius:10px; border:none; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-green { background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.3); }
.btn-blue { background:rgba(52,152,219,.15); color:var(--blue); border:1px solid rgba(52,152,219,.3); }
.btn-orange { background:rgba(245,166,35,.15); color:var(--accent); border:1px solid rgba(245,166,35,.3); }
.btn-red { background:rgba(231,76,60,.15); color:var(--red); border:1px solid rgba(231,76,60,.3); }

/* ── ADMIN SECTIONS ── */
.section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.table-wrap { overflow-x:auto; border-radius:10px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { background:var(--surface2); color:var(--muted); font-weight:700; padding:10px 12px; text-align:left; white-space:nowrap; }
td { padding:9px 12px; border-top:1px solid var(--border); color:var(--text); }
tr:hover td { background:rgba(255,255,255,.02); }
.tag { display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; }
.tag-ok { background:rgba(46,204,113,.15); color:var(--green); }
.tag-neg { background:rgba(231,76,60,.15); color:var(--red); }
.tag-pos { background:rgba(52,152,219,.15); color:var(--blue); }
.edit-cell { background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 6px; font-size:12px; width:60px; outline:none; }

/* ── TOAST ── */
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); background:#222230; border:1px solid var(--accent); color:var(--text); padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; z-index:999; transition:transform .3s; white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }

/* ── EMPTY ── */
.empty { text-align:center; color:var(--muted); padding:40px 20px; }
.empty .ico { font-size:48px; margin-bottom:10px; }
.empty p { font-size:14px; }

/* ── HISTORY ── */
.hist-item { padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin-bottom:8px; cursor:pointer; }
.hist-item:active { background:var(--surface2); }
.hist-top { display:flex; justify-content:space-between; align-items:center; }
.hist-title { font-size:14px; font-weight:700; }
.hist-meta { font-size:11px; color:var(--muted); margin-top:4px; }

/* ── MODAL ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; align-items:flex-end; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; width:100%; max-width:520px; max-height:80vh; overflow-y:auto; padding:20px; }
.modal h3 { font-size:16px; font-weight:800; margin-bottom:14px; }
.modal-close { float:right; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; margin-top:-4px; }

/* ── UTIL ── */
.hidden { display:none !important; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.mt8 { margin-top:8px; }
.mt12 { margin-top:12px; }
.gap8 { gap:8px; }

@media (max-width:380px) {
  .stats-grid { grid-template-columns:repeat(3,1fr); }
  .stat-val { font-size:18px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="logo-box">
    <h1>📦 CONTROL STOCK</h1>
    <p>Quirino Bebidas — Sistema de Inventario</p>
  </div>
  <div class="login-card">
    <h2>Ingresá al sistema</h2>
    <div class="field-group">
      <label>Rol</label>
      <div class="role-btns">
        <button class="role-btn active" onclick="setRole('operario')" id="btn-op">👷 Operario</button>
        <button class="role-btn" onclick="setRole('admin')" id="btn-adm">🔐 Admin</button>
      </div>
    </div>
    <div class="field-group" id="name-field">
      <label>Tu nombre</label>
      <input type="text" id="login-name" placeholder="Ej: Juan, María..." />
    </div>
    <div class="field-group" id="pass-field" style="display:none">
      <label>Contraseña Admin</label>
      <input type="password" id="login-pass" placeholder="••••••••" />
    </div>
    <p class="err" id="login-err">❌ Contraseña incorrecta</p>
    <button class="btn-primary" onclick="doLogin()">Ingresar →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <span class="brand">📦 STOCK</span>
      <span class="role-badge" id="role-badge">Operario</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Salir</button>
  </div>
  <div class="tabs" id="tabs-bar"></div>
  <div class="content" id="content-area"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const ADMIN_PASS = '!SANJO!1849';
let stockData = [];   // productos del sistema
let sessions = JSON.parse(localStorage.getItem('qb_sessions') || '[]');
let currentSession = null;  // { id, operario, proveedor, conteo: {sku: qty}, ts, fin }
let currentRole = 'operario';
let currentUser = '';
let camStream = null, camFacingMode = 'environment', scanLoop = null;
let activeTab = '';

// ── LOAD DATA (embedido + localStorage override) ──────────────────────────────

function getWAPhone() {
  return localStorage.getItem('qb_wa_phone') || '5491157001402';
}

function loadStockData() {
  const saved = localStorage.getItem('qb_stock');
  if (saved) {
    stockData = JSON.parse(saved);
  } else {
    stockData = window.EMBED_DATA || [];
  }
}

function saveStockData() {
  localStorage.setItem('qb_stock', JSON.stringify(stockData));
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function setRole(role) {
  currentRole = role;
  document.getElementById('btn-op').classList.toggle('active', role === 'operario');
  document.getElementById('btn-adm').classList.toggle('active', role === 'admin');
  document.getElementById('name-field').style.display = role === 'operario' ? '' : 'none';
  document.getElementById('pass-field').style.display = role === 'admin' ? '' : 'none';
}

function doLogin() {
  if (currentRole === 'admin') {
    const pass = document.getElementById('login-pass').value.trim();
    if (pass !== ADMIN_PASS) {
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    currentUser = 'Admin';
  } else {
    const name = document.getElementById('login-name').value.trim();
    if (!name) { showToast('Ingresá tu nombre'); return; }
    currentUser = name;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  document.getElementById('role-badge').textContent = currentRole === 'admin' ? '🔐 Admin' : '👷 ' + currentUser;
  buildTabs();
  openTab(currentRole === 'admin' ? 'admin-catalogo' : 'operario-escaneo');
}

function doLogout() {
  stopCamera();
  currentSession = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  const tabs = currentRole === 'admin'
    ? [{id:'admin-catalogo',label:'📋 Catálogo'},{id:'admin-reportes',label:'📊 Reportes'},{id:'admin-historial',label:'🕐 Historial'},{id:'admin-config',label:'⚙ Config'}]
    : [{id:'operario-escaneo',label:'📷 Escanear'},{id:'operario-lista',label:'📝 Lista'},{id:'operario-reporte',label:'📤 Reporte'}];
  tabs.forEach(t => {
    const el = document.createElement('button');
    el.className = 'tab';
    el.textContent = t.label;
    el.onclick = () => openTab(t.id);
    el.id = 'tab-'+t.id;
    bar.appendChild(el);
  });
}

function openTab(id) {
  stopCamera();
  activeTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-'+id));
  const area = document.getElementById('content-area');
  if (id === 'operario-escaneo') renderEscaneo(area);
  else if (id === 'operario-lista') renderLista(area);
  else if (id === 'operario-reporte') renderReporte(area);
  else if (id === 'admin-catalogo') renderAdminCatalogo(area);
  else if (id === 'admin-reportes') renderAdminReportes(area);
  else if (id === 'admin-historial') renderAdminHistorial(area);
  else if (id === 'admin-config') renderAdminConfig(area);
}

// ── OPERARIO: ESCANEO ─────────────────────────────────────────────────────────
function getProveedores() {
  const set = new Set();
  stockData.forEach(p => { if(p.provider && p.provider.trim()) set.add(p.provider.trim()); });
  return ['(Todos)',...Array.from(set).sort()];
}

function getRubros() {
  const set = new Set();
  stockData.forEach(p => { if(p.rubro && p.rubro.trim()) set.add(p.rubro.trim()); });
  return ['(Todos)',...Array.from(set).sort()];
}

function getSubrubros(rubro) {
  const set = new Set();
  stockData.forEach(p => {
    if (rubro === '(Todos)' || p.rubro === rubro) {
      if(p.subrubro && p.subrubro.trim()) set.add(p.subrubro.trim());
    }
  });
  return ['(Todos)',...Array.from(set).sort()];
}

function renderEscaneo(area) {
  const provs = getProveedores();
  const selProv = currentSession ? currentSession.proveedor : '';
  area.innerHTML = `
  <div class="card">
    <h3>📋 Sesión de conteo</h3>
    <div class="field-group mt8">
      <label>Filtrar por Rubro</label>
      <select class="prov-select" id="rubro-sel" onchange="onRubroChange()">
        ${getRubros().map(r => `<option ${r===(window._selRubro||'(Todos)')?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>
    <div class="field-group mt8">
      <label>Filtrar por Subrubro</label>
      <select class="prov-select" id="subrubro-sel" onchange="window._selSubrubro=this.value">
        ${getSubrubros(window._selRubro||'(Todos)').map(s => `<option ${s===(window._selSubrubro||'(Todos)')?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="field-group mt8">
      <label>Proveedor a contar</label>
      <select class="prov-select" id="prov-sel" onchange="onProvChange()">
        ${provs.map(p => `<option ${p===selProv?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="mt8">
      <button class="btn-primary" onclick="iniciarSesion()" id="btn-ini" style="${currentSession?'opacity:.5;cursor:not-allowed':''}" ${currentSession?'disabled':''}>
        ${currentSession ? '✅ Sesión activa' : '▶ Iniciar conteo'}
      </button>
    </div>
    ${currentSession ? `<p style="font-size:12px;color:var(--muted);margin-top:8px">Sesión activa: <strong>${currentSession.proveedor}</strong> — ${Object.keys(currentSession.conteo).length} productos contados</p>` : ''}
  </div>

  ${currentSession ? `
  <div class="card">
    <h3>📷 Escanear código de barras</h3>
    <div class="flex-between mt8">
      <div class="search-wrap" style="flex:1;margin-right:8px">
        <input class="search-input" id="manual-bc" placeholder="Código de barras o nombre..." onkeydown="if(event.key==='Enter')buscarManual()" />
        <button class="search-clear" onclick="document.getElementById('manual-bc').value=''">✕</button>
      </div>
      <button class="scan-btn" onclick="toggleCamera()">📷</button>
    </div>
    <div class="scan-area" id="scan-area">
      <div class="scan-overlay">
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="scan-line"></div>
      </div>
      <div class="camera-btns">
        <button class="cam-btn cam-stop" onclick="stopCamera()">⏹ Detener</button>
        <button class="cam-btn cam-flip" onclick="flipCamera()">🔄 Cámara</button>
      </div>
      <div class="manual-scan-row">
        <input id="cam-manual" placeholder="O escribí código manualmente..." />
        <button onclick="buscarDesdeInput('cam-manual')">Buscar</button>
      </div>
    </div>
    <div id="scan-result" class="mt8"></div>
  </div>` : ''}`;
}

function onProvChange() {}

function onRubroChange() {

  window._selSubrubro = '(Todos)';

  const subSel = document.getElementById('subrubro-sel');

function iniciarSesion() {
  if (currentSession) return;
  const prov = document.getElementById('prov-sel').value;
  const selRubro = document.getElementById('rubro-sel')?.value || '(Todos)';
  const selSubrubro = document.getElementById('subrubro-sel')?.value || '(Todos)';
  currentSession = {
    id: Date.now(),
    operario: currentUser,
    proveedor: prov,
    rubro: selRubro,
    subrubro: selSubrubro,
    conteo: {},
    ts: new Date().toISOString(),
    fin: null
  };
  const filtLabel = selRubro !== '(Todos)' ? selRubro + (selSubrubro !== '(Todos)' ? ' › ' + selSubrubro : '') : prov;
  showToast('✅ Sesión iniciada: ' + filtLabel);
  openTab('operario-escaneo');
}

function toggleCamera() {
  const area = document.getElementById('scan-area');
  if (area && area.classList.contains('active')) { stopCamera(); return; }
  startCamera();
}

function startCamera() {
  if (!navigator.mediaDevices) { showToast('Cámara no disponible'); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacingMode, width:{ ideal:1280 }, height:{ ideal:720 } } })
    .then(stream => {
      camStream = stream;
      const vid = document.getElementById('camera-feed');
      if (!vid) return;
      vid.srcObject = stream;
      vid.play();
      document.getElementById('scan-area').classList.add('active');
      tryScanLoop(vid);
    }).catch(() => showToast('No se pudo acceder a la cámara'));
}

function tryScanLoop(vid) {
  if (!('BarcodeDetector' in window)) return;
  const bd = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code'] });
  const loop = async () => {
    if (!camStream) return;
    try {
      const codes = await bd.detect(vid);
      if (codes.length) {
        const bc = codes[0].rawValue;
        handleBarcode(bc);
        await new Promise(r => setTimeout(r, 2000));
      }
    } catch(e) {}
    if (camStream) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function flipCamera() {
  camFacingMode = camFacingMode === 'environment' ? 'user' : 'environment';
  stopCamera();
  setTimeout(startCamera, 300);
}

function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const area = document.getElementById('scan-area');
  if (area) area.classList.remove('active');
}

function buscarManual() {
  const q = document.getElementById('manual-bc').value.trim();
  if (!q) return;
  handleBarcode(q);
}

function buscarDesdeInput(id) {
  const q = document.getElementById(id).value.trim();
  if (!q) return;
  handleBarcode(q);
}

function handleBarcode(q) {
  if (!currentSession) { showToast('⚠ Iniciá una sesión primero'); return; }
  q = q.trim();
  // buscar por código de barras exacto
  let prod = stockData.find(p => p.barcode && p.barcode.trim() === q);
  // si no, buscar por SKU
  if (!prod) prod = stockData.find(p => p.sku && p.sku.toString() === q);
  // si no, buscar por nombre parcial
  if (!prod) {
    const ql = q.toLowerCase();
    const matches = stockData.filter(p => p.name && p.name.toLowerCase().includes(ql));
    if (matches.length === 1) prod = matches[0];
    else if (matches.length > 1) { showSearchResults(matches); return; }
  }
  if (!prod) {
    playBeep(false);
    showUnknownCard(q);
    return;
  }
  showProductCard(prod);
  playBeep(true);
}

function showSearchResults(matches) {
  const res = document.getElementById('scan-result');
  if (!res) return;
  res.innerHTML = `<p style="font-size:12px;color:var(--muted);margin-bottom:8px">Varios resultados — elegí uno:</p>` +
    matches.slice(0,10).map(p => `
      <div class="prod-item" onclick="showProductCard(stockData.find(x=>x.sku==='${p.sku}'))" style="cursor:pointer">
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">SKU ${p.sku} | Stock: ${p.stock}</div>
        </div>
      </div>`).join('');
}

function pcTipoChange(sku, sysStock) {
  const esBulto = document.querySelector('input[name="pc-tipo"]:checked').value === 'bulto';
  document.getElementById('pc-bulto-row').style.display = esBulto ? 'flex' : 'none';
  document.getElementById('pc-qty-label').textContent = esBulto ? 'Cant. bultos:' : 'Cant. física:';
  pcRecalc(sysStock);
}

function pcRecalc(sysStock) {
  const esBulto = document.querySelector('input[name="pc-tipo"]:checked')?.value === 'bulto';
  const qty = parseInt(document.getElementById('sr-qty')?.value) || 0;
  let total = qty;
  if (esBulto) {
    const upb = parseInt(document.getElementById('pc-upb')?.value) || 1;
    const sueltas = parseInt(document.getElementById('pc-sueltas')?.value) || 0;
    total = qty * upb + sueltas;
    const prev = document.getElementById('pc-total-preview');
    if (prev) {
      const det = sueltas > 0 ? `(${qty}b × ${upb} + ${sueltas} sueltas)` : `(${qty} bulto${qty!==1?'s':''} × ${upb})`;
      prev.textContent = `Total: ${total} unidades ${det}`;
    }
  }
}

function addQty(id, delta) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = Math.max(0, (parseInt(el.value)||0) + delta);
  el.dispatchEvent(new Event('input'));
}

function updateDiff(el, sku, sysStock) {}

function guardarQty(sku, name, sysStock) {
  const el = document.getElementById('sr-qty');
  const bultos = parseInt(el?.value);
  if (isNaN(bultos) || bultos < 0) { showToast('⚠ Ingresá una cantidad válida'); return; }
  const esBulto = document.querySelector('input[name="pc-tipo"]:checked')?.value === 'bulto';
  let total = bultos;
  let toastMsg = '';
  if (esBulto) {
    const upb = parseInt(document.getElementById('pc-upb')?.value) || 1;
    const sueltas = parseInt(document.getElementById('pc-sueltas')?.value) || 0;
    total = bultos * upb + sueltas;
    toastMsg = sueltas > 0
      ? `✅ ${name.slice(0,25)} → ${bultos}b × ${upb} + ${sueltas} = ${total} u.`
      : `✅ ${name.slice(0,25)} → ${bultos} bulto${bultos!==1?'s':''} × ${upb} = ${total} u.`;
  } else {
    toastMsg = `✅ ${name.slice(0,30)} → ${total} unidades`;
  }
  currentSession.conteo[sku] = total;
  showToast(toastMsg);
  document.getElementById('scan-result').innerHTML = '';
  if (document.getElementById('manual-bc')) document.getElementById('manual-bc').value = '';
}

function onTipoChange() {
  const esBulto = document.querySelector('input[name="unk-tipo"]:checked').value === 'bulto';
  const bultoRow = document.getElementById('bulto-row');
  const qtyLabel = document.getElementById('qty-label');
  bultoRow.style.display = esBulto ? 'flex' : 'none';
  qtyLabel.textContent = esBulto ? 'Cant. bultos:' : 'Cant. física:';
  recalcTotal();
}

function recalcTotal() {
  const esBulto = document.querySelector('input[name="unk-tipo"]:checked')?.value === 'bulto';
  if (!esBulto) return;
  const bultos = parseInt(document.getElementById('unk-qty')?.value) || 0;
  const upb = parseInt(document.getElementById('unk-upb')?.value) || 1;
  const sueltas = parseInt(document.getElementById('unk-sueltas')?.value) || 0;
  const total = bultos * upb + sueltas;
  const prev = document.getElementById('total-preview');
  if (prev) {
    const detalle = sueltas > 0
      ? `(${bultos} bulto${bultos!==1?'s':''} × ${upb} + ${sueltas} sueltas)`
      : `(${bultos} bulto${bultos!==1?'s':''} × ${upb})`;
    prev.textContent = `Total: ${total} unidades ${detalle}`;
  }
}

function guardarDesconocido(rawCode) {
  if (!currentSession) return;
  const nombre = document.getElementById('unk-name').value.trim() || '(sin descripción)';
  const tipo = document.querySelector('input[name="unk-tipo"]:checked').value;
  const qty = parseInt(document.getElementById('unk-qty').value);
  if (isNaN(qty) || qty < 0) { showToast('⚠ Ingresá una cantidad válida'); return; }

  let unidadesPorBulto = null;
  let unidadesSueltas = 0;
  let totalUnidades = qty;
  if (tipo === 'bulto') {
    unidadesPorBulto = parseInt(document.getElementById('unk-upb').value) || 1;
    unidadesSueltas = parseInt(document.getElementById('unk-sueltas').value) || 0;
    totalUnidades = qty * unidadesPorBulto + unidadesSueltas;
  }

  const fakeKey = '__UNK__' + rawCode;
  currentSession.conteo[fakeKey] = totalUnidades;
  if (!currentSession.unknowns) currentSession.unknowns = {};
  currentSession.unknowns[fakeKey] = { rawCode, nombre, tipo, qty, unidadesPorBulto, unidadesSueltas, totalUnidades };
  let toastMsg;
  if (tipo === 'bulto') {
    toastMsg = unidadesSueltas > 0
      ? `⚠ ${qty}b × ${unidadesPorBulto} + ${unidadesSueltas} sueltas = ${totalUnidades} u.`
      : `⚠ ${qty} bulto${qty!==1?'s':''} × ${unidadesPorBulto} = ${totalUnidades} u.`;
  } else {
    toastMsg = `⚠ Registrado: ${qty} unidades`;
  }
  const msg = toastMsg;
  showToast(msg);
  document.getElementById('scan-result').innerHTML = '';
  if (document.getElementById('manual-bc')) document.getElementById('manual-bc').value = '';
}

function renderLista(area) {
  if (!currentSession) {
    area.innerHTML = `<div class="empty"><div class="ico">📋</div><p>Iniciá una sesión de conteo en la pestaña Escanear</p></div>`;
    return;
  }
  const prov = currentSession.proveedor;
  const rubro = currentSession.rubro || '(Todos)';
  const subrubro = currentSession.subrubro || '(Todos)';
  let prods = stockData;
  if (rubro !== '(Todos)') prods = prods.filter(p => p.rubro === rubro);
  if (subrubro !== '(Todos)') prods = prods.filter(p => p.subrubro === subrubro);
  if (prov !== '(Todos)') prods = prods.filter(p => p.provider && p.provider.trim() === prov);
  const q = (window._listSearch || '').toLowerCase();
  const filtered = q ? prods.filter(p => p.name.toLowerCase().includes(q) || p.barcode.includes(q) || p.sku.includes(q)) : prods;

  area.innerHTML = `
  <div class="card" style="padding:12px">
    <div class="search-wrap">
      <input class="search-input" id="list-search" placeholder="Buscar en lista..." value="${window._listSearch||''}" oninput="window._listSearch=this.value;renderLista(document.getElementById('content-area'))" />
      <button class="search-clear" onclick="window._listSearch='';renderLista(document.getElementById('content-area'))">✕</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:8px">${filtered.length} productos — ${Object.keys(currentSession.conteo).length} contados</p>
  </div>
  <div class="prod-list" id="prod-list">
    ${filtered.slice(0,200).map(p => {
      const qty = currentSession.conteo[p.sku];
      const hasQty = qty !== undefined;
      const diff = hasQty ? qty - p.stock : null;
      const diffCls = !hasQty ? 'diff-none' : diff===0 ? 'diff-ok' : diff>0 ? 'diff-pos' : 'diff-neg';
      const diffTxt = !hasQty ? '—' : diff>0 ? '+'+diff : diff.toString();
      return `<div class="prod-item ${hasQty?'scanned':''}">
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">SKU ${p.sku} | ${p.barcode||'Sin cod.'}</div>
          <div class="prod-stock">Sistema: ${p.stock}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjQty('${p.sku}',-1)">−</button>
          <input class="qty-input" id="qi-${p.sku}" type="number" value="${hasQty?qty:''}" placeholder="—" min="0" onchange="saveListQty('${p.sku}',this.value)" />
          <button class="qty-btn" onclick="adjQty('${p.sku}',1)">+</button>
        </div>
        <span class="diff-badge ${diffCls}">${diffTxt}</span>
      </div>`;
    }).join('')}
    ${filtered.length > 200 ? `<p style="text-align:center;color:var(--muted);font-size:12px;padding:16px">Mostrando 200 de ${filtered.length}. Usá el buscador para filtrar.</p>` : ''}
  </div>`;
}

function adjQty(sku, delta) {
  const el = document.getElementById('qi-'+sku);
  if (!el) return;
  const newVal = Math.max(0, (parseInt(el.value)||0) + delta);
  el.value = newVal;
  saveListQty(sku, newVal);
}

function saveListQty(sku, val) {
  const v = parseInt(val);
  if (!isNaN(v) && v >= 0) {
    currentSession.conteo[sku] = v;
  }
  // update diff badge visually
  const item = document.getElementById('qi-'+sku)?.closest('.prod-item');
  const prod = stockData.find(p => p.sku === sku);
  if (!item || !prod) return;
  const diff = v - prod.stock;
  const badge = item.querySelector('.diff-badge');
  if (badge) {
    badge.className = 'diff-badge ' + (diff===0?'diff-ok':diff>0?'diff-pos':'diff-neg');
    badge.textContent = diff>0?'+'+diff:diff.toString();
  }
  item.classList.add('scanned');
}

function renderReporte(area) {
  if (!currentSession) {
    area.innerHTML = `<div class="empty"><div class="ico">📊</div><p>Iniciá una sesión de conteo primero</p></div>`;
    return;
  }
  const conteo = currentSession.conteo;
  const keys = Object.keys(conteo);
  const prods = keys.map(sku => {
    const p = stockData.find(x => x.sku === sku) || {sku,name:'—',barcode:'',stock:0,provider:'—'};
    const fis = conteo[sku];
    return {...p, fis, diff: fis - p.stock};
  });
  const normalProds = prods.filter(p => !p.sku.startsWith('__UNK__'));
  const unknownProds = Object.values(currentSession.unknowns || {});
  const ok = normalProds.filter(p => p.diff===0).length;
  const neg = normalProds.filter(p => p.diff<0).length;
  const pos = normalProds.filter(p => p.diff>0).length;

  area.innerHTML = `
  <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-box"><div class="stat-val ok">${ok}</div><div class="stat-lbl">OK</div></div>
    <div class="stat-box"><div class="stat-val neg">${neg}</div><div class="stat-lbl">Faltantes</div></div>
    <div class="stat-box"><div class="stat-val pos">${pos}</div><div class="stat-lbl">Sobrantes</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--yellow)">${unknownProds.length}</div><div class="stat-lbl">A corregir</div></div>
  </div>
  ${unknownProds.length > 0 ? `<div class="card" style="border-color:var(--yellow)">
    <h3 style="color:var(--yellow)">🔍 Códigos sin identificar — para corrección del admin</h3>
    ${unknownProds.map(u => `<div class="prod-item" style="margin-bottom:6px;border-color:var(--yellow)">
      <div class="prod-info">
        <div class="prod-name">${u.nombre}</div>
        <div class="prod-sub">Código: <strong>${u.rawCode}</strong> · ${u.tipo === 'bulto' ? '📦📦 Bulto' : '📦 Pieza'}</div>
        ${u.tipo === 'bulto'
          ? `<div class="prod-sub" style="color:var(--yellow)">${u.qty} bulto${u.qty!==1?'s':''} × ${u.unidadesPorBulto}${u.unidadesSueltas > 0 ? ' + ' + u.unidadesSueltas + ' sueltas' : ''} = <strong>${u.totalUnidades} u.</strong></div>`
          : `<div class="prod-sub" style="color:var(--yellow)">${u.totalUnidades} unidades físicas</div>`}
      </div>
      <span class="diff-badge" style="background:rgba(241,196,15,.15);color:var(--yellow)">${u.totalUnidades} ud.</span>
    </div>`).join('')}
  </div>` : ''}
  <div class="card">
    <h3>📤 Acciones</h3>
    <div class="action-row">
      <button class="action-btn btn-green" onclick="sendWhatsApp()">📲 WhatsApp</button>
      <button class="action-btn btn-blue" onclick="exportExcel()">📥 Excel</button>
    </div>
    <div class="action-row mt8">
      <button class="action-btn btn-orange" onclick="finalizarSesion()">✅ Finalizar</button>
      <button class="action-btn btn-red" onclick="resetSesion()">🗑 Cancelar</button>
    </div>
  </div>
  ${prods.length === 0 ? '<div class="empty"><div class="ico">📭</div><p>Todavía no contaste ningún producto</p></div>' : `
  <div class="card">
    <h3>Diferencias detectadas</h3>
    ${prods.filter(p=>p.diff!==0).length === 0 ? '<p style="color:var(--green);font-size:14px">✅ Todo coincide</p>' :
      prods.filter(p=>p.diff!==0).map(p => `
        <div class="prod-item ${p.diff<0?'':'scanned'}" style="margin-bottom:6px">
          <div class="prod-info">
            <div class="prod-name">${p.name}</div>
            <div class="prod-sub">SKU ${p.sku}</div>
            <div class="prod-sub">Sistema: ${p.stock} | Físico: ${p.fis}</div>
          </div>
          <span class="diff-badge ${p.diff===0?'diff-ok':p.diff>0?'diff-pos':'diff-neg'}">${p.diff>0?'+'+p.diff:p.diff}</span>
        </div>`).join('')}
  </div>`}`;
}

function sendWhatsApp() {
  if (!currentSession || Object.keys(currentSession.conteo).length === 0) {
    showToast('Sin productos contados'); return;
  }
  const now = new Date().toLocaleString('es-AR');
  const conteo = currentSession.conteo;
  const prods = Object.keys(conteo).map(sku => {
    const p = stockData.find(x => x.sku === sku) || {name:'?',stock:0};
    const fis = conteo[sku];
    const diff = fis - p.stock;
    return { name: p.name, stock: p.stock, fis, diff };
  });
  const diffs = prods.filter(p => p.diff !== 0);
  let msg = `📦 *CONTROL DE STOCK — QUIRINO BEBIDAS*\n`;
  msg += `📅 ${now}\n`;
  msg += `👷 Operario: ${currentSession.operario}\n`;
  msg += `🏭 Proveedor: ${currentSession.proveedor}\n\n`;
  msg += `*Total contados:* ${prods.length}\n`;
  msg += `✅ OK: ${prods.filter(p=>p.diff===0).length}\n`;
  msg += `🔴 Faltantes: ${prods.filter(p=>p.diff<0).length}\n`;
  msg += `🔵 Sobrantes: ${prods.filter(p=>p.diff>0).length}\n`;
  if (diffs.length > 0) {
    msg += `\n*⚠ DIFERENCIAS:*\n`;
    diffs.slice(0,30).forEach(p => {
      msg += `• ${p.name}: Sistema ${p.stock} / Físico ${p.fis} → *${p.diff>0?'+'+p.diff:p.diff}*\n`;
    });
    if (diffs.length > 30) msg += `_...y ${diffs.length-30} más_\n`;
  } else {
    msg += `\n✅ Sin diferencias detectadas.`;
  }
  // Códigos desconocidos para corrección del admin
  const unknowns = currentSession.unknowns ? Object.values(currentSession.unknowns) : [];
  if (unknowns.length > 0) {
    msg += `\n\n*🔍 CÓDIGOS A CORREGIR (${unknowns.length}):*\n`;
    unknowns.forEach(u => {
      if (u.tipo === 'bulto') {
        const detalleBulto = u.unidadesSueltas > 0
          ? `${u.qty} bulto${u.qty!==1?'s':''} × ${u.unidadesPorBulto} + ${u.unidadesSueltas} sueltas = *${u.totalUnidades} unidades*`
          : `${u.qty} bulto${u.qty!==1?'s':''} × ${u.unidadesPorBulto} = *${u.totalUnidades} unidades*`;
        msg += `• Código BULTO: *${u.rawCode}* | ${u.nombre} | ${detalleBulto}\n`;
      } else {
        msg += `• Código PIEZA: *${u.rawCode}* | ${u.nombre} | Físico: *${u.totalUnidades} unidades*\n`;
      }
    });
    msg += `_Pendiente: vincular código al SKU correcto en el sistema._`;
  }
  const num = getWAPhone();
  const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function exportExcel() {
  if (!currentSession) return;
  const rows = [['SKU','Código de Barras','Nombre','Proveedor','Stock Sistema','Stock Físico','Diferencia']];
  Object.keys(currentSession.conteo).forEach(sku => {
    const p = stockData.find(x => x.sku === sku) || {};
    const fis = currentSession.conteo[sku];
    rows.push([p.sku||sku, p.barcode||'', p.name||'', p.provider||'', p.stock||0, fis, fis-(p.stock||0)]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Control');
  XLSX.writeFile(wb, `control_stock_${currentSession.proveedor.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function finalizarSesion() {
  if (!currentSession) return;
  if (!confirm('¿Finalizar y guardar sesión?')) return;
  currentSession.fin = new Date().toISOString();
  sessions.push({...currentSession});
  localStorage.setItem('qb_sessions', JSON.stringify(sessions));
  currentSession = null;
  showToast('✅ Sesión guardada en historial');
  openTab('operario-escaneo');
}

function resetSesion() {
  if (!currentSession) return;
  if (!confirm('¿Cancelar sesión sin guardar?')) return;
  currentSession = null;
  openTab('operario-escaneo');
}

// ── ADMIN: CATÁLOGO ───────────────────────────────────────────────────────────
function renderAdminCatalogo(area) {
  const q = (window._adminSearch||'').toLowerCase();
  const ar = window._adminRubro || '(Todos)';
  const as_ = window._adminSubrubro || '(Todos)';
  let filtered = stockData;
  if (ar !== '(Todos)') filtered = filtered.filter(p => p.rubro === ar);
  if (as_ !== '(Todos)') filtered = filtered.filter(p => p.subrubro === as_);
  if (q) filtered = filtered.filter(p=>p.name.toLowerCase().includes(q)||p.barcode.includes(q)||p.sku.includes(q));

  area.innerHTML = `
  <div class="card" style="padding:12px">
    <div class="flex-between" style="margin-bottom:10px">
      <h3 style="margin:0">📋 Catálogo (${stockData.length})</h3>
    </div>
    <div class="search-wrap" style="margin-bottom:8px">
      <input class="search-input" id="admin-search" placeholder="Buscar por nombre, código o SKU..." value="${window._adminSearch||''}" oninput="window._adminSearch=this.value;renderAdminCatalogo(document.getElementById('content-area'))" />
      <button class="search-clear" onclick="window._adminSearch='';renderAdminCatalogo(document.getElementById('content-area'))">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <select class="prov-select" style="flex:1;font-size:12px;padding:8px 10px" onchange="window._adminRubro=this.value;window._adminSubrubro='(Todos)';renderAdminCatalogo(document.getElementById('content-area'))">
        ${getRubros().map(r=>`<option ${r===(window._adminRubro||'(Todos)')?'selected':''}>${r}</option>`).join('')}
      </select>
      <select class="prov-select" style="flex:1;font-size:12px;padding:8px 10px" onchange="window._adminSubrubro=this.value;renderAdminCatalogo(document.getElementById('content-area'))">
        ${getSubrubros(window._adminRubro||'(Todos)').map(s=>`<option ${s===(window._adminSubrubro||'(Todos)')?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="action-row" style="margin-bottom:10px">
      <label class="action-btn btn-orange" style="cursor:pointer">📤 Importar Excel <input type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)" /></label>
      <button class="action-btn btn-blue" onclick="exportarCatalogo()">📥 Exportar</button>
    </div>
    <button class="action-btn btn-green" style="width:100%" onclick="addProductModal()">➕ Agregar producto</button>
  </div>
  <div class="table-wrap">
    <table>
      <tr><th>SKU</th><th>Código</th><th>Nombre</th><th>Rubro</th><th>Stock</th><th>Proveedor</th><th></th></tr>
      ${filtered.slice(0,150).map((p,i) => `
        <tr>
          <td>${p.sku}</td>
          <td style="font-size:10px">${p.barcode||'—'}</td>
          <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.name}">${p.name}</td>
          <td style="font-size:10px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.rubro||''}${p.subrubro?' › '+p.subrubro:''}</td>
          <td><input class="edit-cell" type="number" value="${p.stock}" onchange="editStock('${p.sku}',this.value)" /></td>
          <td style="font-size:10px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.provider}</td>
          <td><button onclick="delProduct('${p.sku}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px">🗑</button></td>
        </tr>`).join('')}
    </table>
    ${filtered.length>150?`<p style="text-align:center;color:var(--muted);font-size:12px;padding:12px">Mostrando 150 de ${filtered.length}. Usá el buscador.</p>`:''}
  </div>`;
}

function editStock(sku, val) {
  const v = parseInt(val);
  if (isNaN(v)) return;
  const p = stockData.find(x => x.sku === sku);
  if (p) { p.stock = v; saveStockData(); }
}

function delProduct(sku) {
  if (!confirm('¿Eliminar producto?')) return;
  stockData = stockData.filter(p => p.sku !== sku);
  saveStockData();
  renderAdminCatalogo(document.getElementById('content-area'));
}

function importExcel(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
    let added=0, updated=0;
    for (let i=1; i<rows.length; i++) {
      const r = rows[i];
      if (!r || !r[0]) continue;
      const sku = r[0]?.toString().trim();
      const barcode = r[1]?.toString().trim()||'';
      const name = r[2]?.toString().trim()||'';
      const stock = parseInt(r[3])||0;
      const provider = r[4]?.toString().trim()||'';
      const idx = stockData.findIndex(p => p.sku === sku);
      if (idx>=0) { stockData[idx]={sku,barcode,name,stock,provider}; updated++; }
      else { stockData.push({sku,barcode,name,stock,provider}); added++; }
    }
    saveStockData();
    showToast(`✅ ${added} agregados, ${updated} actualizados`);
    renderAdminCatalogo(document.getElementById('content-area'));
  };
  reader.readAsBinaryString(file);
  input.value = '';
}

function exportarCatalogo() {
  const rows = [['SKU','Código de Barras','Nombre','Stock','Proveedor']];
  stockData.forEach(p => rows.push([p.sku,p.barcode,p.name,p.stock,p.provider]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Catalogo');
  XLSX.writeFile(wb, 'catalogo_quirino_stock.xlsx');
}

function addProductModal() {
  const existing = document.getElementById('add-modal-bg');
  if (existing) existing.remove();
  const bg = document.createElement('div');
  bg.className = 'modal-bg open';
  bg.id = 'add-modal-bg';
  bg.innerHTML = `<div class="modal">
    <button class="modal-close" onclick="document.getElementById('add-modal-bg').remove()">✕</button>
    <h3>➕ Nuevo producto</h3>
    <div class="field-group"><label>SKU</label><input type="text" id="new-sku" /></div>
    <div class="field-group mt8"><label>Código de barras</label><input type="text" id="new-bc" /></div>
    <div class="field-group mt8"><label>Nombre</label><input type="text" id="new-name" /></div>
    <div class="field-group mt8"><label>Stock</label><input type="number" id="new-stock" value="0" /></div>
    <div class="field-group mt8"><label>Proveedor</label><input type="text" id="new-prov" /></div>
    <button class="btn-primary mt12" onclick="saveNewProduct()">Guardar</button>
  </div>`;
  document.body.appendChild(bg);
}

function saveNewProduct() {
  const sku = document.getElementById('new-sku').value.trim();
  const bc = document.getElementById('new-bc').value.trim();
  const name = document.getElementById('new-name').value.trim();
  const stock = parseInt(document.getElementById('new-stock').value)||0;
  const prov = document.getElementById('new-prov').value.trim();
  if (!sku || !name) { showToast('SKU y nombre son obligatorios'); return; }
  if (stockData.find(p=>p.sku===sku)) { showToast('SKU ya existe'); return; }
  stockData.push({sku,barcode:bc,name,stock,provider:prov});
  saveStockData();
  document.getElementById('add-modal-bg').remove();
  showToast('✅ Producto agregado');
  renderAdminCatalogo(document.getElementById('content-area'));
}

// ── ADMIN: REPORTES ───────────────────────────────────────────────────────────
function renderAdminReportes(area) {
  if (sessions.length === 0) {
    area.innerHTML = `<div class="empty"><div class="ico">📊</div><p>No hay sesiones completadas aún</p></div>`; return;
  }
  // agrupamos diferencias de todas las sesiones
  const allDiffs = {};
  sessions.forEach(s => {
    Object.keys(s.conteo).forEach(sku => {
      const p = stockData.find(x=>x.sku===sku)||{name:'?',stock:0};
      const fis = s.conteo[sku];
      const diff = fis - p.stock;
      if (diff !== 0) {
        if (!allDiffs[sku]) allDiffs[sku] = {name:p.name, sku, totalDiff:0, count:0};
        allDiffs[sku].totalDiff += diff;
        allDiffs[sku].count++;
      }
    });
  });
  const sorted = Object.values(allDiffs).sort((a,b) => Math.abs(b.totalDiff)-Math.abs(a.totalDiff));

  area.innerHTML = `
  <div class="card">
    <h3>📊 Resumen general</h3>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val">${sessions.length}</div><div class="stat-lbl">Sesiones</div></div>
      <div class="stat-box"><div class="stat-val neg">${sorted.filter(d=>d.totalDiff<0).length}</div><div class="stat-lbl">Faltantes</div></div>
      <div class="stat-box"><div class="stat-val pos">${sorted.filter(d=>d.totalDiff>0).length}</div><div class="stat-lbl">Sobrantes</div></div>
    </div>
    <div class="action-row mt8">
      <button class="action-btn btn-blue" onclick="exportReporteExcel()">📥 Excel</button>
      <button class="action-btn btn-green" onclick="sendReporteWA()">📲 WhatsApp</button>
    </div>
  </div>
  ${sorted.length === 0 ? '<div class="card"><p style="color:var(--green)">✅ Sin diferencias acumuladas</p></div>' : `
  <div class="table-wrap">
    <table>
      <tr><th>Producto</th><th>SKU</th><th>Controles</th><th>Dif. total</th></tr>
      ${sorted.slice(0,100).map(d => `<tr>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${d.name}</td>
        <td>${d.sku}</td>
        <td>${d.count}</td>
        <td><span class="tag ${d.totalDiff===0?'tag-ok':d.totalDiff>0?'tag-pos':'tag-neg'}">${d.totalDiff>0?'+':''}{d.totalDiff}</span></td>
      </tr>`).join('')}
    </table>
  </div>`}`;
}

function exportReporteExcel() {
  const rows = [['Sesión ID','Operario','Proveedor','Fecha Inicio','Fecha Fin','SKU','Código','Nombre','Stock Sistema','Stock Físico','Diferencia']];
  sessions.forEach(s => {
    Object.keys(s.conteo).forEach(sku => {
      const p = stockData.find(x=>x.sku===sku)||{barcode:'',name:'?',stock:0};
      const fis = s.conteo[sku];
      rows.push([s.id, s.operario, s.proveedor, s.ts, s.fin||'', sku, p.barcode, p.name, p.stock, fis, fis-p.stock]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
  XLSX.writeFile(wb, 'reporte_control_stock.xlsx');
}

function sendReporteWA() {
  const total = sessions.reduce((acc,s) => acc + Object.keys(s.conteo).length, 0);
  let msg = `📊 *REPORTE CONTROL STOCK — QUIRINO BEBIDAS*\n`;
  msg += `📅 ${new Date().toLocaleString('es-AR')}\n\n`;
  msg += `*Total sesiones:* ${sessions.length}\n`;
  msg += `*Total productos contados:* ${total}\n\n`;
  sessions.slice(-5).forEach(s => {
    const n = Object.keys(s.conteo).length;
    msg += `▸ ${s.proveedor} (${s.operario}) — ${n} productos — ${new Date(s.ts).toLocaleDateString('es-AR')}\n`;
  });
  window.open(`https://wa.me/${getWAPhone()}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ── ADMIN: HISTORIAL ──────────────────────────────────────────────────────────
function renderAdminHistorial(area) {
  if (sessions.length === 0) {
    area.innerHTML = `<div class="empty"><div class="ico">🕐</div><p>No hay sesiones registradas</p></div>`; return;
  }
  area.innerHTML = `
  <div class="card" style="padding:12px">
    <div class="flex-between">
      <h3 style="margin:0">${sessions.length} sesión${sessions.length!==1?'es':''}</h3>
      <button onclick="clearHistory()" style="background:none;border:none;color:var(--red);font-size:13px;cursor:pointer">🗑 Borrar todo</button>
    </div>
  </div>
  ${[...sessions].reverse().map(s => {
    const n = Object.keys(s.conteo).length;
    const diffs = Object.keys(s.conteo).filter(sku => {
      const p = stockData.find(x=>x.sku===sku);
      return p && s.conteo[sku] !== p.stock;
    }).length;
    return `<div class="hist-item" onclick="viewSession('${s.id}')">
      <div class="hist-top">
        <span class="hist-title">${s.proveedor}</span>
        <span class="diff-badge ${diffs===0?'diff-ok':'diff-neg'}">${diffs===0?'OK':'⚠ '+diffs+' dif.'}</span>
      </div>
      <div class="hist-meta">👷 ${s.operario} · ${n} productos · ${new Date(s.ts).toLocaleString('es-AR')}</div>
    </div>`;
  }).join('')}`;
}

function clearHistory() {
  if (!confirm('¿Borrar todo el historial?')) return;
  sessions = [];
  localStorage.setItem('qb_sessions', '[]');
  renderAdminHistorial(document.getElementById('content-area'));
}

function viewSession(id) {
  const s = sessions.find(x => x.id == id);
  if (!s) return;
  const prods = Object.keys(s.conteo).map(sku => {
    const p = stockData.find(x=>x.sku===sku)||{name:'?',barcode:'',stock:0,provider:'—'};
    return {...p, fis: s.conteo[sku], diff: s.conteo[sku]-p.stock};
  });
  const bg = document.getElementById('hist-modal-bg') || document.createElement('div');
  bg.id = 'hist-modal-bg';
  bg.className = 'modal-bg open';
  bg.innerHTML = `<div class="modal">
    <button class="modal-close" onclick="document.getElementById('hist-modal-bg').classList.remove('open')">✕</button>
    <h3>${s.proveedor}</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">👷 ${s.operario} · ${new Date(s.ts).toLocaleString('es-AR')}</p>
    <div class="table-wrap">
      <table>
        <tr><th>Producto</th><th>Sist.</th><th>Fís.</th><th>Dif.</th></tr>
        ${prods.map(p=>`<tr>
          <td style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</td>
          <td>${p.stock}</td>
          <td>${p.fis}</td>
          <td><span class="tag ${p.diff===0?'tag-ok':p.diff>0?'tag-pos':'tag-neg'}">${p.diff>0?'+'+p.diff:p.diff}</span></td>
        </tr>`).join('')}
      </table>
    </div>
    <div class="action-row mt12">
      <button class="action-btn btn-blue" onclick="exportSessionExcel('${s.id}')">📥 Excel</button>
      <button class="action-btn btn-green" onclick="shareSessionWA('${s.id}')">📲 WA</button>
    </div>
  </div>`;
  if (!document.getElementById('hist-modal-bg')) document.body.appendChild(bg);
  bg.classList.add('open');
}

function exportSessionExcel(id) {
  const s = sessions.find(x=>x.id==id);
  if (!s) return;
  const rows = [['SKU','Código','Nombre','Proveedor','Stock Sistema','Stock Físico','Diferencia']];
  Object.keys(s.conteo).forEach(sku => {
    const p = stockData.find(x=>x.sku===sku)||{barcode:'',name:'?',stock:0,provider:''};
    rows.push([sku,p.barcode,p.name,p.provider,p.stock,s.conteo[sku],s.conteo[sku]-p.stock]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sesion');
  XLSX.writeFile(wb, `sesion_${s.proveedor.replace(/\s/g,'_')}_${s.id}.xlsx`);
}

function shareSessionWA(id) {
  const s = sessions.find(x=>x.id==id);
  if (!s) return;
  currentSession = s;
  sendWhatsApp();
  currentSession = null;
}

function formatPhonePreview(val) {
  if (!val) return '';
  // Try to format as Argentina number
  const v = val.replace(/\D/g,'');
  if (v.startsWith('549')) return `🇦🇷 +${v.slice(0,2)} (${v.slice(2,4)}) ${v.slice(4,6)}-${v.slice(6,10)}-${v.slice(10)}`;
  return `📞 +${v}`;
}

function previewPhone(val) {
  const p = document.getElementById('phone-preview');
  if (p) p.textContent = formatPhonePreview(val.replace(/\D/g,''));
}

function savePhone() {
  const raw = document.getElementById('cfg-phone').value;
  const val = raw.replace(/\D/g,'');
  if (val.length < 8) { showToast('⚠ Número muy corto (mínimo 8 dígitos)'); return; }
  localStorage.setItem('qb_wa_phone', val);
  showToast('✅ Guardado: ' + val);
  renderAdminConfig(document.getElementById('content-area'));
}

// ── BEEP ──────────────────────────────────────────────────────────────────────
function playBeep(ok) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = ok ? 880 : 220;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (ok?0.15:0.4));
    osc.start(); osc.stop(ctx.currentTime + (ok?0.15:0.4));
  } catch(e) {}
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

loadStockData();
